<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<title>Taller de Electrónica</title>

<style>

body{
  margin:0;
  font-family:'Courier New', monospace;
  background-color:#ffe4ec;
  color:#5a2a3a;
}

/* HEADER */

header{
  background-color:#ff9bb3;
  padding:15px;
  text-align:center;
  font-size:24px;
  font-weight:bold;
  border-bottom:3px solid #ff6f91;
  box-shadow:0 0 20px rgba(255,105,180,0.3);
}

/* NAV */

nav{
  background-color:#ffc1d3;
  padding:10px;
  text-align:center;
  position:sticky;
  top:0;
  z-index:100;
}

nav a{
  margin:0 10px;
  text-decoration:none;
  color:#5a2a3a;
  font-weight:bold;
  padding:8px 14px;
  border:2px solid #ff6f91;
  border-radius:12px;
  transition:0.3s;
}

nav a:hover{
  background-color:#ff6f91;
  color:white;
  box-shadow:0 0 15px #ff9fc8;
}

/* BOTÓN VOLVER */

.btn-volver{
  display:inline-block;
  margin:20px;
  padding:12px 22px;
  background:linear-gradient(90deg,#ffd6e7,#ffb6d9);
  color:#8a3d63;
  text-decoration:none;
  border-radius:15px;
  font-weight:bold;
  border:3px solid #fff0f6;
  box-shadow:0 0 15px rgba(255,182,217,0.5);
  transition:0.3s;
}

.btn-volver:hover{
  transform:scale(1.05);
  background:linear-gradient(90deg,#ffb6d9,#ff8fc4);
  box-shadow:0 0 20px #ff9fc8;
}

/* SECCIONES */

section{
  padding:20px;
  border-bottom:2px dashed #ff9bb3;
}

h2{
  color:#d63384;
}

.card{
  background-color:#fff0f5;
  padding:15px;
  border-radius:12px;
  box-shadow:2px 2px 8px rgba(0,0,0,0.1);
  margin-top:10px;
}

/* MENÚ DESPLEGABLE */

.menu-desplegable{
  margin-top:20px;
  border-radius:18px;
  overflow:hidden;
  border:3px solid #ff9bb3;
  box-shadow:0 0 15px rgba(255,105,180,0.2);
}

.menu-desplegable summary{
  list-style:none;
  cursor:pointer;
  padding:18px;
  font-size:24px;
  font-weight:bold;
  color:#d63384;
  background:linear-gradient(90deg,#ffd1e3,#ffb6cf);
  position:relative;
  transition:0.3s;
}

.menu-desplegable summary:hover{
  background:linear-gradient(90deg,#ffb6cf,#ff8eb8);
  color:white;
}

.menu-desplegable summary::after{
  content:'▼';
  position:absolute;
  right:20px;
  transition:0.3s;
}

.menu-desplegable[open] summary::after{
  transform:rotate(180deg);
}

.menu-desplegable .card{
  animation:aparecer 0.5s ease;
}

@keyframes aparecer{
  from{
    opacity:0;
    transform:translateY(-10px);
  }

  to{
    opacity:1;
    transform:translateY(0);
  }
}

/* CIRCUITO RETRO */

.circuito-box{
  background:linear-gradient(145deg,#fff0f6,#ffd6e7);
  border:4px solid #ff78aa;
  border-radius:25px;
  padding:25px;
  margin:20px;
  box-shadow:0 0 25px rgba(255,105,180,0.4);
  overflow:hidden;
}

.circuito-titulo{
  text-align:center;
  color:#d63384;
  font-size:28px;
  margin-bottom:20px;
  text-shadow:0 0 10px #ff8cc6;
}

svg{
  max-width:100%;
}

.cable{
  fill:none;
  stroke:#ffb3d1;
  stroke-width:10;
  stroke-linecap:round;
}

.real{
  fill:none;
  stroke:#4cc9ff;
  stroke-width:5;
  stroke-dasharray:12;
  animation:moverReal 2s linear infinite;
}

.conv{
  fill:none;
  stroke:#ff4f81;
  stroke-width:5;
  stroke-dasharray:12;
  animation:moverConv 2s linear infinite reverse;
}

.bombillo{
  animation:brillo 1s infinite alternate;
}

.info-circuito{
  margin-top:20px;
  background:#fff5fa;
  padding:18px;
  border-radius:15px;
  border:2px dashed #ff8eb8;
  color:#5a2a3a;
  line-height:1.8;
}

.azul{
  color:#4cc9ff;
  font-weight:bold;
}

.rojo{
  color:#ff4f81;
  font-weight:bold;
}

@keyframes moverReal{
  from{
    stroke-dashoffset:0;
  }

  to{
    stroke-dashoffset:100;
  }
}

@keyframes moverConv{
  from{
    stroke-dashoffset:0;
  }

  to{
    stroke-dashoffset:-100;
  }
}

@keyframes brillo{
  from{
    filter:drop-shadow(0 0 5px #fff);
    transform:scale(1);
  }

  to{
    filter:drop-shadow(0 0 25px #ffd84d);
    transform:scale(1.03);
  }
}

</style>
</head>

<body>

<header>
🌸 Taller de Fundamentos de Electrónica 🌸
</header>

<nav>
<a href="#conceptos">Conceptos</a>
<a href="#analisis">Análisis</a>
<a href="#aplicacion">Aplicación</a>
<a href="#actividad">Actividad</a>
<a href="#circuito">Circuito</a>
</nav>

← Volver al Portafolio
</a>

<!-- RESTO DE TU CONTENIDO -->

</body>
</html>
